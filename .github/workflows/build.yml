name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '6.0.x'

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Install fonts and system libs (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          fontconfig libfontconfig1 libgdiplus \
          fonts-dejavu-core fonts-dejavu-extra \
          fonts-liberation fonts-freefont-ttf \
          imagemagick
        # Rebuild font cache so ImageMagick type.xml picks up new fonts
        fc-cache -fv
        magick -list font | grep -i dejavu || echo "DejaVu not in Magick list, fallback fonts will be used"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-pdf2docx-0.5.9
        restore-keys: ${{ runner.os }}-pip-

    - name: Install pdf2docx Python backend
      run: pip install https://github.com/ArtifexSoftware/pdf2docx/releases/download/v0.5.9/pdf2docx-0.5.9-py3-none-any.whl

    - name: Test with coverage
      env:
        FONTCONFIG_PATH: /etc/fonts
        FONTCONFIG_FILE: /etc/fonts/fonts.conf
      run: >
        dotnet test --configuration Release --no-build --verbosity normal
        --blame-hang-timeout 120s
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput=./coverage/

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: '**/coverage/*.xml'
        retention-days: 14

  publish:
    name: Publish Artifacts
    needs: build
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact-name: PDFEditor-Windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: PDFEditor-Linux-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish
      run: >
        dotnet publish src/PDFEditor.UI/PDFEditor.UI.csproj
        --configuration Release
        --runtime ${{ matrix.rid }}
        --self-contained true
        -p:PublishSingleFile=true
        --output ./publish

    - name: Cache pip packages (publish)
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-sidecar-pdf2docx-0.5.9-pyinstaller
        restore-keys: ${{ runner.os }}-pip-sidecar-

    - name: Cache PyInstaller sidecar build
      uses: actions/cache@v4
      id: sidecar-cache
      with:
        path: tools/pdf2docx-cli/dist
        key: ${{ runner.os }}-sidecar-${{ hashFiles('tools/pdf2docx-cli/main.py') }}-pdf2docx-0.5.9

    - name: Build and bundle pdf2docx-cli sidecar (Windows)
      if: matrix.os == 'windows-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        pip install pyinstaller --quiet
        pip install https://github.com/ArtifexSoftware/pdf2docx/releases/download/v0.5.9/pdf2docx-0.5.9-py3-none-any.whl --quiet
        python -m PyInstaller --onefile --name pdf2docx-cli `
          --distpath tools/pdf2docx-cli/dist `
          --workpath tools/pdf2docx-cli/build `
          --specpath tools/pdf2docx-cli `
          --clean --noconfirm `
          tools/pdf2docx-cli/main.py
        if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

    - name: Build and bundle pdf2docx-cli sidecar (Linux)
      if: matrix.os == 'ubuntu-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
      run: |
        pip install pyinstaller --quiet
        pip install https://github.com/ArtifexSoftware/pdf2docx/releases/download/v0.5.9/pdf2docx-0.5.9-py3-none-any.whl --quiet
        python3 -m PyInstaller --onefile --name pdf2docx-cli \
          --distpath tools/pdf2docx-cli/dist \
          --workpath tools/pdf2docx-cli/build \
          --specpath tools/pdf2docx-cli \
          --clean --noconfirm \
          tools/pdf2docx-cli/main.py

    - name: Copy sidecar to publish dir (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Copy-Item tools/pdf2docx-cli/dist/pdf2docx-cli.exe ./publish/
        Write-Host "Sidecar bundled: $('{0:N1}' -f ((Get-Item ./publish/pdf2docx-cli.exe).Length/1MB)) MB"

    - name: Copy sidecar to publish dir (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp tools/pdf2docx-cli/dist/pdf2docx-cli ./publish/
        echo "Sidecar bundled: $(du -sh ./publish/pdf2docx-cli | cut -f1)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ./publish/
        retention-days: 30

    - name: Upload portable ZIP
      uses: actions/upload-artifact@v4
      if: false  # GitHub already provides source archives on every release; no separate zip needed
      with:
        name: ${{ matrix.artifact-name }}-portable
        path: ./PDFEditor-${{ matrix.rid }}-portable.zip
        retention-days: 30

    - name: Build MSI installer (Windows only)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # Extract version from tag (v1.2.3 → 1.2.3) or fall back to Directory.Build.props
        $ref = '${{ github.ref_name }}'
        if ($ref -match '^v?(\d+\.\d+\.\d+)') {
          $appVersion = $matches[1]
        } else {
          $appVersion = ([xml](Get-Content 'Directory.Build.props')).Project.PropertyGroup.Version
        }
        Write-Host "Building MSI version $appVersion"

        # Find WiX — prefer pre-installed on the runner; fall back to choco
        $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\bin" }
        if (-not $wixBin -or -not (Test-Path "$wixBin\heat.exe")) {
          Write-Host "WiX not found, installing via choco..."
          choco install wixtoolset -y --no-progress
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" |
                    Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\bin" }
        }
        if (-not $wixBin) { throw "WiX Toolset not found after install attempt" }
        Write-Host "Using WiX from: $wixBin"
        $env:Path += ";$wixBin"

        New-Item -ItemType Directory -Force -Path installer/obj | Out-Null

        # Resolve all paths to absolute Windows paths (WiX v3 chokes on relative/forward-slash paths)
        $publishDir = (Resolve-Path '.\publish').Path
        $installerDir = (Resolve-Path '.\installer').Path
        $objDir = "$installerDir\obj"
        Write-Host "Publish dir : $publishDir"
        Write-Host "Installer dir: $installerDir"

        Write-Host "==> heat: harvesting publish dir..."
        & "$wixBin\heat.exe" dir "$publishDir" -cg PublishedFiles -dr INSTALLFOLDER -gg -sreg -srd -sfrag -out "$objDir\harvested.wxs"
        if ($LASTEXITCODE -ne 0) { throw "heat.exe failed (exit $LASTEXITCODE)" }

        Write-Host "==> candle: compiling base WXS..."
        & "$wixBin\candle.exe" "$installerDir\PDFEditor.Installer.v3.wxs" "-dPublishDir=$publishDir" "-dAppVersion=$appVersion" -ext WixUIExtension -out "$objDir\base.wixobj"
        if ($LASTEXITCODE -ne 0) { throw "candle.exe (base) failed (exit $LASTEXITCODE)" }

        Write-Host "==> candle: compiling harvested WXS..."
        & "$wixBin\candle.exe" "$objDir\harvested.wxs" -out "$objDir\harvested.wixobj"
        if ($LASTEXITCODE -ne 0) { throw "candle.exe (harvested) failed (exit $LASTEXITCODE)" }

        Write-Host "==> light: linking MSI..."
        & "$wixBin\light.exe" -ext WixUIExtension -out "$installerDir\PDFEditor-Setup-win-x64.msi" -b "$publishDir" -b "$installerDir" "$objDir\base.wixobj" "$objDir\harvested.wixobj"
        if ($LASTEXITCODE -ne 0) { throw "light.exe failed (exit $LASTEXITCODE)" }

        $msiSize = '{0:N1}' -f ((Get-Item "$installerDir\PDFEditor-Setup-win-x64.msi").Length / 1MB)
        Write-Host "MSI built successfully: PDFEditor-Setup-win-x64.msi ($msiSize MB)"

    - name: Upload MSI artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: PDFEditor-Setup-win-x64
        path: installer/PDFEditor-Setup-win-x64.msi
        retention-days: 30

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download MSI
      uses: actions/download-artifact@v4
      with:
        name: PDFEditor-Setup-win-x64
        path: ./release-assets

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "PDF Editor ${{ github.ref_name }}"
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        generate_release_notes: true
        files: |
          ./release-assets/PDFEditor-Setup-win-x64.msi

